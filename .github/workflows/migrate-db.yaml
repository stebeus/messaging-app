name: Migrate Database

on:
  push:
    branches:
      - main

    paths:
      - .github/workflows/migrate-db.yaml
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml

  workflow_dispatch:

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          runtime: node@${{ matrix.node }}
          working-directory: api

      - name: Install dependencies
        run: pnpm ci

      - name: Build internal packages
        run: pnpm build --filter=api^...

      - name: Migrate database
        run: pnpm --filter=api db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
